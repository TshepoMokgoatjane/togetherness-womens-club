<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">

    <h2><i class="bi bi-person-circle me-2"></i>My Profile</h2>

    <div class="card mt-3">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Member Number</dt>
                <dd class="col-sm-9" th:text="${member.memberNumber}"></dd>

                <dt class="col-sm-3">Name</dt>
                <dd class="col-sm-9" th:text="${member.firstName + ' ' + member.lastName}"></dd>

                <dt class="col-sm-3">Email</dt>
                <dd class="col-sm-9" th:text="${member.email}"></dd>

                <dt class="col-sm-3">Phone</dt>
                <dd class="col-sm-9" th:text="${member.phoneNumber}"></dd>

                <dt class="col-sm-3">Status</dt>
                <dd class="col-sm-9">
                    <span class="badge bg-success" th:text="${member.status}"></span>
                </dd>
            </dl>
        </div>
    </div>

    <!-- QUICK LINKS -->
    <div class="row g-3 mt-4">
        <div class="col-md-4">
            <a th:href="@{/my/dependents}" class="card text-decoration-none h-100 border-0 shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-person-hearts text-success display-5"></i>
                    <h6 class="mt-2">My Dependents</h6>
                    <small class="text-muted" th:text="${dependents.size()} + ' registered'"></small>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/my/contributions}" class="card text-decoration-none h-100 border-0 shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-cash-coin text-success display-5"></i>
                    <h6 class="mt-2">My Contributions</h6>
                    <small class="text-muted" th:text="${contributions.size()} + ' payments'"></small>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/my/claims}" class="card text-decoration-none h-100 border-0 shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-file-earmark-medical text-success display-5"></i>
                    <h6 class="mt-2">My Claims</h6>
                    <small class="text-muted">View &amp; submit claims</small>
                </div>
            </a>
        </div>
    </div>

</div>

</html>
