<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">
    <h2>
        <i class="bi bi-people me-2"></i>Dependents for
        <span th:text="${member.firstName + ' ' + member.lastName}"></span>
    </h2>

    <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
        <a th:href="@{/members/{id}/dependents/new(id=${member.id})}" class="btn btn-success"
           th:if="${member.status.name() == 'ACTIVE'}">
            <i class="bi bi-person-plus me-1"></i>Add Dependent
        </a>
        <a th:href="@{/members/{id}(id=${member.id})}" class="btn btn-secondary">
            <i class="bi bi-arrow-left me-1"></i>Back to Member
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Surname</th>
                <th>ID No#</th>
                <th>Phone No#</th>
                <th>Email</th>
                <th>Relationship</th>
                <th style="width: 100px">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="dependent : ${dependents}">
                <td th:text="${dependent.firstName}"></td>
                <td th:text="${dependent.lastName}"></td>
                <td th:text="${dependent.idNumber}"></td>
                <td th:text="${dependent.phoneNumber}"></td>
                <td th:text="${dependent.email}"></td>
                <td th:text="${dependent.relationship}"></td>
                <td>
                    <button type="button" class="btn btn-sm btn-danger" title="Delete"
                            onclick="confirmDeleteDependent(this)"
                            th:data-name="${dependent.firstName + ' ' + dependent.lastName}"
                            th:data-url="@{/members/{memberId}/dependents/{depId}/delete(memberId=${member.id}, depId=${dependent.id})}">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(dependents)}">
                <td colspan="7" class="text-center text-muted py-4">
                    <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                    No dependents found
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- DELETE CONFIRMATION MODAL -->
    <div class="modal fade" id="deleteDependentModal" tabindex="-1" aria-labelledby="deleteDependentModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="deleteDependentModalLabel">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        Delete Dependent?
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    Are you sure you want to delete
                    <strong id="dependentNamePlaceholder" class="text-danger"></strong>?
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <form id="deleteDependentForm" method="post">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <button type="submit" class="btn btn-danger" id="confirmDeleteDependentBtn">
                            <span id="deleteDependentBtnText">
                                <i class="bi bi-trash me-1"></i> Delete
                            </span>
                            <span id="deleteDependentSpinner" class="spinner-border spinner-border-sm ms-2 text-light d-none"></span>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
    <!-- END DELETE CONFIRMATION -->

    <!-- JAVASCRIPT DELETE -->
    <script th:inline="javascript">
        function confirmDeleteDependent(button) {
            let url = button.getAttribute("data-url");
            let name = button.getAttribute("data-name");

            document.getElementById("deleteDependentForm").action = url;
            document.getElementById("dependentNamePlaceholder").textContent = name;

            let modal = new bootstrap.Modal(document.getElementById('deleteDependentModal'));
            modal.show();
        }

        let deleteDependentForm = document.getElementById("deleteDependentForm");
        if (deleteDependentForm) {
            deleteDependentForm.addEventListener("submit", function() {
                let btn = document.getElementById("confirmDeleteDependentBtn");
                let spinner = document.getElementById("deleteDependentSpinner");

                btn.disabled = true;
                spinner.classList.remove("d-none");
                document.getElementById("deleteDependentBtnText").style.opacity = "0.7";

                let modalEl = document.getElementById('deleteDependentModal');
                let modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();
            });
        }
    </script>
    <!-- END JS DELETE -->

</div>

</html>
