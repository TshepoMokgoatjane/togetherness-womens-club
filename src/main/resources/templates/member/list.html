<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/NPl2m6O2klTlmCjA0y6GBg/CHKM4li"
          crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/members}">
            <i class="bi bi-people-fill me-2"></i>Togetherness Women's Club
        </a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Members</h2>
        <a th:href="@{/members/new}" class="btn btn-success" role="button">
            <i class="bi bi-person-plus me-1"></i>Add Member
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Member No#</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Phone</th>
                    <th>Alternative</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th style="width: 220px">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="member : ${members}">
                    <td th:text="${member.memberNumber}"></td>
                    <td th:text="${member.firstName}"></td>
                    <td th:text="${member.lastName}"></td>
                    <td th:text="${member.phoneNumber}"></td>
                    <td th:text="${member.alternativePhoneNumber}"></td>
                    <td th:text="${member.email}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${member.status.name() == 'ACTIVE'} ? 'bg-success' :
                                              (${member.status.name() == 'INACTIVE'} ? 'bg-secondary' :
                                              (${member.status.name() == 'SUSPENDED'} ? 'bg-warning text-dark' : 'bg-dark'))"
                              th:text="${member.status}"></span>
                    </td>
                    <td>
                        <a th:href="@{/members/{id}(id=${member.id})}"
                           class="btn btn-sm btn-outline-dark me-1" title="View">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/members/{id}/edit(id=${member.id})}"
                           class="btn btn-sm btn-success me-1" title="Edit">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/members/{id}/delete(id=${member.id})}"
                              method="post" style="display:inline;"
                              onsubmit="return confirm('Are you sure you want to remove this member?');">
                            <button type="submit" class="btn btn-sm btn-danger" title="Delete">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(members)}">
                    <td colspan="8" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        No members found
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
