<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">

    <h2><i class="bi bi-person-circle me-2"></i>My Profile</h2>

    <div class="card mt-3">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Username</dt>
                <dd class="col-sm-9" th:text="${user.username}"></dd>

                <dt class="col-sm-3">E-mail Address</dt>
                <dd class="col-sm-9" th:text="${user.email}"></dd>

                <dt class="col-sm-3">Role</dt>
                <dd class="col-sm-9">
                    <span class="badge bg-success" th:text="${user.role}"></span>
                </dd>
            </dl>
        </div>
    </div>

    <div class="mt-3 text-muted">
        <i class="bi bi-info-circle me-1"></i>
        Contact an administrator to update your account details or request elevated access.
    </div>

</div>

</html>
