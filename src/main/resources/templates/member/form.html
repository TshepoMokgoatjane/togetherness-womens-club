<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/NPl2m6O2klTlmCjA0y6GBg/CHKM4li"
          crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/members}">
            <i class="bi bi-people-fill me-2"></i>Togetherness Women's Club
        </a>
    </div>
</nav>

<div class="container">
    <h2 th:text="${member.id != null} ? 'Edit Member' : 'Add New Member'">Member Form</h2>

    <div class="card mt-3">
        <div class="card-body">
            <form th:action="${member.id != null} ? @{/members/{id}(id=${member.id})} : @{/members}"
                  th:object="${member}"
                  method="post">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName"
                               th:field="*{firstName}"
                               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}"
                             th:errors="*{firstName}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName"
                               th:field="*{lastName}"
                               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}"
                             th:errors="*{lastName}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="idNumber" class="form-label">ID Number</label>
                        <input type="text" class="form-control" id="idNumber"
                               th:field="*{idNumber}" maxlength="13"
                               th:classappend="${#fields.hasErrors('idNumber')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('idNumber')}"
                             th:errors="*{idNumber}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email"
                               th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="phoneNumber" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phoneNumber"
                               th:field="*{phoneNumber}" maxlength="10"
                               th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}"
                             th:errors="*{phoneNumber}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="alternativePhoneNumber" class="form-label">Alternative Phone</label>
                        <input type="text" class="form-control" id="alternativePhoneNumber"
                               th:field="*{alternativePhoneNumber}" maxlength="10" />
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="birthDate" class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="birthDate"
                               th:field="*{birthDate}"
                               th:classappend="${#fields.hasErrors('birthDate')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('birthDate')}"
                             th:errors="*{birthDate}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="joinDate" class="form-label">Date Joined</label>
                        <input type="date" class="form-control" id="joinDate"
                               th:field="*{joinDate}"
                               th:classappend="${#fields.hasErrors('joinDate')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('joinDate')}"
                             th:errors="*{joinDate}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-12">
                        <label for="physicalAddress" class="form-label">Physical Address</label>
                        <textarea class="form-control" id="physicalAddress"
                                  th:field="*{physicalAddress}" rows="3"></textarea>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-lg me-1"></i>Save
                    </button>
                    <a th:href="@{/members}" class="btn btn-secondary ms-2">
                        <i class="bi bi-x-lg me-1"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
