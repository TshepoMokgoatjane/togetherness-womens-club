<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Dependent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/NPl2m6O2klTlmCjA0y6GBg/CHKM4li"
          crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/members}">
            <i class="bi bi-people-fill me-2"></i>Togetherness Women's Club
        </a>
    </div>
</nav>

<div class="container">
    <h2>
        <i class="bi bi-person-plus me-2"></i>Add Dependent for
        <span th:text="${member.firstName + ' ' + member.lastName}"></span>
    </h2>

    <div class="card mt-3">
        <div class="card-body">
            <form th:action="@{/members/{memberId}/dependents(memberId=${member.id})}"
                  th:object="${dependent}"
                  method="post">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName"
                               th:field="*{firstName}"
                               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}"
                             th:errors="*{firstName}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName"
                               th:field="*{lastName}"
                               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}"
                             th:errors="*{lastName}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="idNumber" class="form-label">ID Number</label>
                        <input type="text" class="form-control" id="idNumber"
                               th:field="*{idNumber}" maxlength="13"
                               th:classappend="${#fields.hasErrors('idNumber')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('idNumber')}"
                             th:errors="*{idNumber}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="birthDate" class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="birthDate"
                               th:field="*{birthDate}"
                               th:classappend="${#fields.hasErrors('birthDate')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('birthDate')}"
                             th:errors="*{birthDate}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="relationship" class="form-label">Relationship</label>
                        <select class="form-select" id="relationship"
                                th:field="*{relationship}"
                                th:classappend="${#fields.hasErrors('relationship')} ? 'is-invalid'">
                            <option value="">-- Select Relationship --</option>
                            <option th:each="rel : ${relationships}"
                                    th:value="${rel}"
                                    th:text="${rel}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('relationship')}"
                             th:errors="*{relationship}"></div>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-lg me-1"></i>Save
                    </button>
                    <a th:href="@{/members/{id}/dependents(id=${member.id})}" class="btn btn-secondary ms-2">
                        <i class="bi bi-x-lg me-1"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
