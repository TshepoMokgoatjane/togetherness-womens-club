<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">

    <h2><i class="bi bi-cash-coin me-2"></i>My Contributions</h2>

    <a th:href="@{/my}" class="btn btn-secondary btn-sm mb-3">
        <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
    </a>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Amount</th>
                    <th>Reference</th>
                    <th>Payment Date</th>
                    <th>Month</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="contribution, iter : ${contributions}">
                    <td th:text="${iter.count}"></td>
                    <td th:text="${contribution.amount != null} ? 'R ' + ${#numbers.formatDecimal(contribution.amount, 1, 2)} : '-'"></td>
                    <td th:text="${contribution.reference} ?: '-'"></td>
                    <td th:text="${contribution.paymentDate} ?: '-'"></td>
                    <td th:text="${contribution.contributionMonth}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${contribution.status.name() == 'PAID'} ? 'bg-success' :
                                              (${contribution.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-danger')"
                              th:text="${contribution.status}"></span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(contributions)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        No contributions recorded yet
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

</html>
