<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">

    <h2><i class="bi bi-cash-coin me-2"></i>All Contributions</h2>

    <div class="table-responsive mt-3">

        <!-- SEARCH & FILTER -->
        <form method="GET" th:action="@{/contributions}" class="row g-2 mb-3">
            <div class="col-md-3">
                <input type="text" name="search" class="form-control" placeholder="Search member or reference..." th:value="${search}" />
            </div>
            <div class="col-md-3">
                <select name="status" class="form-select">
                    <option value="">All Statuses</option>
                    <option value="PAID" th:selected="${status != null && status.name() == 'PAID'}">Paid</option>
                    <option value="PENDING" th:selected="${status != null && status.name() == 'PENDING'}">Pending</option>
                    <option value="MISSED" th:selected="${status != null && status.name() == 'MISSED'}">Missed</option>
                </select>
            </div>
            <div class="col-md-2">
                <select name="sortBy" class="form-select">
                    <option value="paymentDate" th:selected="${sortBy == 'paymentDate'}">Sort: Payment Date</option>
                    <option value="amount" th:selected="${sortBy == 'amount'}">Sort: Amount</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-search me-1"></i>Filter
                </button>
            </div>
            <div class="col-md-2" th:if="${search != null || status != null}">
                <a th:href="@{/contributions}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-lg me-1"></i>Clear
                </a>
            </div>
        </form>

        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Member No#</th>
                    <th>Member</th>
                    <th>Amount</th>
                    <th>Reference</th>
                    <th>Payment Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="contribution, iter : ${contributions}">
                    <td th:text="${contribution.member.memberNumber}"></td>
                    <td th:text="${contribution.member.firstName + ' ' + contribution.member.lastName}"></td>
                    <td th:text="${contribution.amount != null} ? 'R ' + ${#numbers.formatDecimal(contribution.amount, 1, 2)} : '-'"></td>
                    <td th:text="${contribution.reference != null ? contribution.reference : '-'}"></td>
                    <td th:text="${contribution.paymentDate != null ? contribution.paymentDate : '-'}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${contribution.status.name() == 'PAID'} ? 'bg-success' :
                                              (${contribution.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-danger')"
                              th:text="${contribution.status}"></span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(contributions)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        No contributions found
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- PAGINATION -->
        <nav aria-label="Page navigation" th:if="${totalPages > 1}">
            <div class="d-flex justify-content-between align-items-center mt-3">
                <small class="text-muted" th:text="'Showing page ' + (${currentPage} + 1) + ' of ' + ${totalPages}"></small>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/contributions(page=${currentPage - 1}, size=${pageSize}, sortBy=${sortBy}, search=${search}, status=${status})}">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        class="page-item"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/contributions(page=${i}, size=${pageSize}, sortBy=${sortBy}, search=${search}, status=${status})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/contributions(page=${currentPage + 1}, size=${pageSize}, sortBy=${sortBy}, search=${search}, status=${status})}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
    </div>

</div>

</html>
