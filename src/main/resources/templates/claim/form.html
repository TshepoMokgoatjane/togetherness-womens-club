<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">

    <h2>
        <i class="bi bi-file-earmark-medical me-2"></i>Submit Burial Claim for
        <span th:text="${member.firstName + ' ' + member.lastName}"></span>
    </h2>

    <div class="card mt-3">
        <div class="card-body">
            <form th:action="@{/members/{memberId}/claims(memberId=${member.id})}"
                  th:object="${claim}"
                  method="post"
                  enctype="multipart/form-data">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="deceasedName" class="form-label">Deceased Name</label>
                        <input type="text" class="form-control" id="deceasedName"
                               th:field="*{deceasedName}"
                               th:classappend="${#fields.hasErrors('deceasedName')} ? 'is-invalid'"
                               placeholder="Full name of the deceased" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('deceasedName')}"
                             th:errors="*{deceasedName}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="claimAmount" class="form-label">Claim Amount (R)</label>
                        <input type="number" step="0.01" class="form-control" id="claimAmount"
                               th:field="*{claimAmount}"
                               th:classappend="${#fields.hasErrors('claimAmount')} ? 'is-invalid'"
                               placeholder="Enter claim amount" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('claimAmount')}"
                             th:errors="*{claimAmount}"></div>
                    </div>
                </div>

                <!-- DOCUMENT UPLOAD -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Supporting Documents</label>
                    <p class="text-muted small">Upload Death Certificate, Birth Certificate, Proof of Address, etc. (PDF, JPEG, PNG - max 5MB each)</p>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="doc1" class="form-label">Document 1</label>
                            <input type="file" class="form-control" id="doc1" name="documents" accept=".pdf,.jpg,.jpeg,.png" />
                            <select class="form-select form-select-sm mt-1" name="documentTypes">
                                <option value="DEATH_CERTIFICATE">Death Certificate</option>
                                <option value="BIRTH_CERTIFICATE">Birth Certificate</option>
                                <option value="PROOF_OF_ADDRESS">Proof of Address</option>
                                <option value="ID_DOCUMENT">ID Document</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="doc2" class="form-label">Document 2 (optional)</label>
                            <input type="file" class="form-control" id="doc2" name="documents" accept=".pdf,.jpg,.jpeg,.png" />
                            <select class="form-select form-select-sm mt-1" name="documentTypes">
                                <option value="DEATH_CERTIFICATE">Death Certificate</option>
                                <option value="BIRTH_CERTIFICATE">Birth Certificate</option>
                                <option value="PROOF_OF_ADDRESS">Proof of Address</option>
                                <option value="ID_DOCUMENT">ID Document</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-lg me-1"></i>Submit Claim
                    </button>
                    <a th:href="@{/members/{id}(id=${member.id})}" class="btn btn-secondary ms-2">
                        <i class="bi bi-x-lg me-1"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

</div>

</html>
