<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-person-gear me-2"></i>User Account Management</h2>
    </div>

    <p class="text-muted mb-4">Link user accounts to member records so they can access their personal dashboard.</p>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Linked Member</th>
                    <th style="width: 350px">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td>
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${user.username}"></span>
                    </td>
                    <td th:text="${user.email != null ? user.email : '-'}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${user.role == 'ADMIN'} ? 'bg-danger' :
                                              (${user.role == 'TREASURER'} ? 'bg-primary' : 'bg-secondary')"
                              th:text="${user.role}"></span>
                    </td>
                    <td>
                        <th:block th:if="${user.memberId != null}">
                            <th:block th:each="member : ${members}" th:if="${member.id == user.memberId}">
                                <span class="badge bg-success">
                                    <i class="bi bi-link-45deg me-1"></i>
                                    <span th:text="${member.memberNumber + ' - ' + member.firstName + ' ' + member.lastName}"></span>
                                </span>
                            </th:block>
                        </th:block>
                        <th:block th:if="${user.memberId == null}">
                            <span class="badge bg-warning text-dark">
                                <i class="bi bi-exclamation-triangle me-1"></i>Not linked
                            </span>
                        </th:block>
                    </td>
                    <td>
                        <!-- LINK FORM -->
                        <form th:action="@{/admin/users/{id}/link(id=${user.id})}" method="post" class="d-inline-flex align-items-center gap-2">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <select name="memberId" class="form-select form-select-sm" style="width: 200px;" required>
                                <option value="">-- Select Member --</option>
                                <option th:each="member : ${members}"
                                        th:value="${member.id}"
                                        th:text="${member.memberNumber + ' - ' + member.firstName + ' ' + member.lastName}"
                                        th:selected="${user.memberId != null && user.memberId == member.id}">
                                </option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-success" title="Link">
                                <i class="bi bi-link-45deg"></i> Link
                            </button>
                        </form>

                        <!-- UNLINK BUTTON -->
                        <form th:if="${user.memberId != null}"
                              th:action="@{/admin/users/{id}/unlink(id=${user.id})}" method="post" class="d-inline ms-1">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Unlink"
                                    onclick="return confirm('Are you sure you want to unlink this user from their member record?')">
                                <i class="bi bi-x-circle"></i> Unlink
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        No user accounts found
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

</html>
