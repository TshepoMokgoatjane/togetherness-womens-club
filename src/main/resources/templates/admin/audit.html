<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-clock-history me-2"></i>Audit Trail</h2>
    </div>

    <p class="text-muted mb-4">System activity log showing all create, update, and delete operations.</p>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Timestamp</th>
                    <th>User</th>
                    <th>Action</th>
                    <th>Entity</th>
                    <th>Entity ID</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="log : ${auditLogs}">
                    <td th:text="${#temporals.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td>
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${log.username}"></span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${log.action.name() == 'CREATED'} ? 'bg-success' :
                                              (${log.action.name() == 'UPDATED'} ? 'bg-primary' : 'bg-danger')"
                              th:text="${log.action}"></span>
                    </td>
                    <td th:text="${log.entityName}"></td>
                    <td th:text="${log.entityId}"></td>
                    <td class="small text-muted" th:text="${log.details}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(auditLogs)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        No audit logs found
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- PAGINATION -->
    <nav aria-label="Page navigation" th:if="${totalPages > 1}">
        <div class="d-flex justify-content-between align-items-center mt-3">
            <small class="text-muted" th:text="'Page ' + (${currentPage} + 1) + ' of ' + ${totalPages}"></small>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/audit(page=${currentPage - 1}, size=${pageSize})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    class="page-item"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/admin/audit(page=${i}, size=${pageSize})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/audit(page=${currentPage + 1}, size=${pageSize})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

</div>

</html>
