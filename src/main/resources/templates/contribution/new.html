<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">

    <h2><i class="bi bi-cash-coin me-2"></i>Record Contribution</h2>

    <div class="card mt-3">
        <div class="card-body">
            <form th:action="@{/contributions}" th:object="${contribution}" method="post" enctype="multipart/form-data">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="memberId" class="form-label">Member</label>
                        <select class="form-select" id="memberId" name="memberId" required
                                th:classappend="${memberError} ? 'is-invalid'">
                            <option value="">-- Select Member --</option>
                            <option th:each="member : ${members}"
                                    th:value="${member.id}"
                                    th:selected="${member.id == selectedMemberId}"
                                    th:text="${member.memberNumber + ' - ' + member.firstName + ' ' + member.lastName}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${memberError}" th:text="${memberError}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="amount" class="form-label">Amount (R)</label>
                        <input type="number" step="0.01" class="form-control" id="amount"
                               th:field="*{amount}"
                               th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'"
                               placeholder="Enter contribution amount" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('amount')}"
                             th:errors="*{amount}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="reference" class="form-label">Reference</label>
                        <input type="text" class="form-control" id="reference"
                               th:field="*{reference}"
                               th:classappend="${#fields.hasErrors('reference')} ? 'is-invalid'"
                               placeholder="Payment reference (e.g. bank ref)" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('reference')}"
                             th:errors="*{reference}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="proofOfPayment" class="form-label">Proof of Payment (optional)</label>
                        <input type="file" class="form-control" id="proofOfPayment" name="proofOfPayment" accept=".pdf,.jpg,.jpeg,.png" />
                        <small class="text-muted">PDF, JPEG, or PNG - max 5MB</small>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-lg me-1"></i>Save
                    </button>
                    <a th:href="@{/contributions}" class="btn btn-secondary ms-2">
                        <i class="bi bi-x-lg me-1"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

</div>

</html>
