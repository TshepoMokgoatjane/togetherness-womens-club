<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi bi-person-plus me-2"></i>Add Dependent for
            <span th:text="${member.firstName + ' ' + member.lastName}"></span>
        </h2>
    </div>

    <div class="card mt-3">
        <div class="card-body">
            <form th:action="@{/members/{memberId}/dependents(memberId=${member.id})}"
                  th:object="${dependent}"
                  method="post">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName"
                               th:field="*{firstName}"
                               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}"
                             th:errors="*{firstName}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName"
                               th:field="*{lastName}"
                               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}"
                             th:errors="*{lastName}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="idNumber" class="form-label">ID Number</label>
                        <input type="text" class="form-control" id="idNumber"
                               th:field="*{idNumber}" maxlength="13"
                               th:classappend="${#fields.hasErrors('idNumber')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('idNumber')}"
                             th:errors="*{idNumber}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email"
                               th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}"></div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="phoneNumber" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phoneNumber"
                               placeholder="Enter 10-digit number"
                               th:field="*{phoneNumber}"
                               th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}"
                             th:errors="*{phoneNumber}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="alternativePhoneNumber" class="form-label">Alternative Phone Number</label>
                        <input type="tel" class="form-control" id="alternativePhoneNumber"
                               placeholder="Enter 10-digit number"
                               th:field="*{alternativePhoneNumber}"
                               th:classappend="${#fields.hasErrors('alternativePhoneNumber')} ? 'is-invalid'" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('alternativePhoneNumber')}"
                             th:errors="*{alternativePhoneNumber}"></div>
                    </div>

                </div>

                <div class="row mb-3">
                    <div class="col-md-12">
                        <label for="physicalAddress" class="form-label">Physical Address</label>
                        <textarea class="form-control" id="physicalAddress" th:field="*{physicalAddress}" rows="3"
                        th:classappend="${#fields.hasErrors('physicalAddress')} ? 'is-invalid'"></textarea>

                        <div class="invalid-feedback" th:if="${#fields.hasErrors('physicalAddress')}"
                             th:errors="*{physicalAddress}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="relationship" class="form-label">Relationship</label>
                        <select class="form-select" id="relationship"
                                th:field="*{relationship}"
                                th:classappend="${#fields.hasErrors('relationship')} ? 'is-invalid'">
                            <option value="">-- Select Relationship --</option>
                            <option th:each="rel : ${relationships}"
                                    th:value="${rel}"
                                    th:text="${rel}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('relationship')}"
                             th:errors="*{relationship}"></div>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-lg me-1"></i>Save
                    </button>
                    <a th:href="@{/members/{id}/dependents(id=${member.id})}" class="btn btn-secondary ms-2">
                        <i class="bi bi-x-lg me-1"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

</html>
