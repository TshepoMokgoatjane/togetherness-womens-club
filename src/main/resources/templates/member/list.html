<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/members}">
            <i class="bi bi-people-fill me-2"></i>Togetherness Women's Club
        </a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Members</h2>
        <a th:href="@{/members/new}" class="btn btn-success" role="button">
            <i class="bi bi-person-plus me-1"></i>Add Member
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Member No#</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Phone</th>
                    <th>Alternative</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th style="width: 220px">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="member : ${members}">
                    <td th:text="${member.memberNumber}"></td>
                    <td th:text="${member.firstName}"></td>
                    <td th:text="${member.lastName}"></td>
                    <td th:text="${member.phoneNumber}"></td>
                    <td th:text="${member.alternativePhoneNumber}"></td>
                    <td th:text="${member.email}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${member.status.name() == 'ACTIVE'} ? 'bg-success' :
                                              (${member.status.name() == 'INACTIVE'} ? 'bg-secondary' :
                                              (${member.status.name() == 'SUSPENDED'} ? 'bg-warning text-dark' : 'bg-dark'))"
                              th:text="${member.status}"></span>
                    </td>
                    <td>
                        <a th:href="@{/members/{id}(id=${member.id})}"
                           class="btn btn-sm btn-outline-dark me-1" title="View">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/members/{id}/edit(id=${member.id})}"
                           class="btn btn-sm btn-success me-1" title="Edit">
                            <i class="bi bi-pencil"></i>
                        </a>

                        <!-- DELETE BUTTON -->
                        <button type="button" class="btn btn-sm btn-danger" title="Delete"
                                onclick="confirmDelete(this)"
                                th:data-name="${member.firstName + ' ' + member.lastName}"
                                th:data-url="@{/members/{id}/delete(id=${member.id})}">
                            <i class="bi bi-trash"></i>
                        </button>
                        <!-- END DELETE BUTTON -->

                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(members)}">
                    <td colspan="8" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        No members found
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- DELETE CONFIRMATION MODAL -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="deleteConfirmModalLabel">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            Delete Member?
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    Are you sure you want to delete
                    <strong id="memberNamePlaceholder" class="text-danger"></strong>?
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <form id="deleteForm" method="post">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <button type="submit" class="btn btn-danger" id="confirmDeleteBtn">
                            <span id="deleteBtnText">
                                <i class="bi bi-trash me-1"></i> Delete
                            </span>

                            <span id="deleteSpinner" class="spinner-border spinner-border-sm ms-2 text-light d-none"></span>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
    <!-- END DELETE CONFIRMATION -->
</div>

<!-- JAVASCRIPT DELETE -->
<script>
    function confirmDelete(button) {
        // Get delete URL from button
        let url = button.getAttribute("data-url");

        // Get member name
        let name = button.getAttribute("data-name");

        // Set form action dynamically
        document.getElementById("deleteForm").action = url;
        document.getElementById("memberNamePlaceholder").textContent = name;

        // Show modal
        let modal = new bootstrap.Modal(document.getElementById('deleteConfirmModal'));
        modal.show();
    }

    // HANDLE DELETE SUBMIT
    let deleteForm = document.getElementById("deleteForm");

    if (deleteForm) {
        deleteForm.addEventListener("submit", function() {
            let btn = document.getElementById("confirmDeleteBtn");
            let spinner = document.getElementById("deleteSpinner");

            // Disable button (prevent double click)
            btn.disabled = true;

            // Show spinner
            spinner.classList.remove("d-none");
            document.getElementById("deleteBtnText").style.opacity = "0.7";

            let modalEl = document.getElementById('deleteConfirmModal');
            let modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();
        })
    }

</script>
<!-- END JS DELETE -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
