<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">

    <h2><i class="bi bi-key me-2"></i>Change Password</h2>

    <div class="row justify-content-center mt-4">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form th:action="@{/profile/change-password}" method="post">

                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Current Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="currentPassword"
                                       name="currentPassword" required placeholder="Enter current password" />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" id="newPassword"
                                       name="newPassword" required minlength="6" placeholder="At least 6 characters" />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" id="confirmPassword"
                                       name="confirmPassword" required placeholder="Re-enter new password" />
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-lg me-1"></i>Change Password
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/profile}" class="text-muted">
                            <i class="bi bi-arrow-left me-1"></i>Back to Profile
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

</div>

</html>
