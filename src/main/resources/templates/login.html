<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Togetherness Women's Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
</head>
<body class="bg-dark d-flex align-items-center" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <!-- LOGO -->
            <div class="text-center mb-4">
                <img th:src="@{/images/logo-square.png}" alt="Togetherness Women's Club" height="120" class="mb-3" />
                <h4 class="text-white fw-bold">Togetherness <span class="text-success">Women's Club</span></h4>
            </div>

            <!-- LOGIN CARD -->
            <div class="card shadow">
                <div class="card-body p-4">

                    <h5 class="card-title text-center mb-4">Sign In</h5>

                    <!-- ERROR MESSAGE -->
                    <div th:if="${param.error}" class="alert alert-danger alert-sm" role="alert">
                        <i class="bi bi-exclamation-circle me-1"></i>
                        Invalid username or password.
                    </div>

                    <!-- LOGOUT MESSAGE -->
                    <div th:if="${param.logout}" class="alert alert-success alert-sm" role="alert">
                        <i class="bi bi-check-circle me-1"></i>
                        You have been logged out successfully.
                    </div>

                    <!-- REGISTRATION SUCCESS -->
                    <div th:if="${successMessage}" class="alert alert-success alert-sm" role="alert">
                        <i class="bi bi-check-circle me-1"></i>
                        <span th:text="${successMessage}"></span>
                    </div>

                    <form th:action="@{/login}" method="post">

                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="username" name="username"
                                       placeholder="Enter username" required autofocus />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="Enter password" required />
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                            </button>
                        </div>

                        <div class="text-end mt-2">
                            <small><a th:href="@{/forgot-password}" class="text-muted">Forgot password?</a></small>
                        </div>

                    </form>

                    <div class="text-center mt-3">
                        <small>Don't have an account? <a th:href="@{/register}" class="text-success">Register</a></small>
                    </div>
                </div>
            </div>

            <!-- FOOTER -->
            <p class="text-center text-secondary mt-4">
                <small>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> Togetherness Women's Club</small>
            </p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
