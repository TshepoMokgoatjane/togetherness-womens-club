<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Members</h2>
        <a th:href="@{/members/new}" class="btn btn-primary" role="button">
            <i class="bi bi-person-plus me-1"></i>Add Member
        </a>
    </div>

    <!-- SEARCH & FILTER -->
    <form method="GET" th:action="@{/members}" class="row g-2 mb-3">
        <div class="col-md-4">
            <input type="text" name="search" class="form-control" placeholder="Search by name, member no, email..." th:value="${search}" />
        </div>
        <div class="col-md-3">
            <select name="status" class="form-select">
                <option value="">All Statuses</option>
                <option value="ACTIVE" th:selected="${status != null && status.name() == 'ACTIVE'}">Active</option>
                <option value="INACTIVE" th:selected="${status != null && status.name() == 'INACTIVE'}">Inactive</option>
                <option value="SUSPENDED" th:selected="${status != null && status.name() == 'SUSPENDED'}">Suspended</option>
                <option value="DECEASED" th:selected="${status != null && status.name() == 'DECEASED'}">Deceased</option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-search me-1"></i>Filter
            </button>
        </div>
        <div class="col-md-2" th:if="${search != null || status != null}">
            <a th:href="@{/members}" class="btn btn-outline-secondary">
                <i class="bi bi-x-lg me-1"></i>Clear
            </a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Member No#</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Phone</th>
                    <th>Alternative</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th style="width: 220px">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="member : ${members}">
                    <td th:text="${member.memberNumber}"></td>
                    <td th:text="${member.firstName}"></td>
                    <td th:text="${member.lastName}"></td>
                    <td th:text="${member.phoneNumber}"></td>
                    <td th:text="${member.alternativePhoneNumber}"></td>
                    <td th:text="${member.email}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${member.status.name() == 'ACTIVE'} ? 'bg-success' :
                                              (${member.status.name() == 'INACTIVE'} ? 'bg-secondary' :
                                              (${member.status.name() == 'SUSPENDED'} ? 'bg-warning text-dark' : 'bg-dark'))"
                              th:text="${member.status}"></span>
                    </td>
                    <td>
                        <a th:href="@{/members/{id}(id=${member.id})}"
                           class="btn btn-sm btn-outline-warning me-1" title="View">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/members/{id}/edit(id=${member.id})}"
                           class="btn btn-sm btn-info me-1" title="Edit">
                            <i class="bi bi-pencil"></i>
                        </a>

                        <!-- DELETE BUTTON -->
                        <button type="button" class="btn btn-sm btn-danger" title="Delete"
                                onclick="confirmDelete(this)"
                                th:data-name="${member.firstName + ' ' + member.lastName}"
                                th:data-url="@{/members/{id}/delete(id=${member.id})}">
                            <i class="bi bi-trash"></i>
                        </button>
                        <!-- END DELETE BUTTON -->

                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(members)}">
                    <td colspan="8" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        No members found
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- PAGINATION -->
    <nav aria-label="Page navigation" th:if="${totalPages > 1}">
        <div class="d-flex justify-content-between align-items-center mt-3">
            <small class="text-muted" th:text="'Showing page ' + (${currentPage} + 1) + ' of ' + ${totalPages}"></small>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/members(page=${currentPage - 1}, size=${pageSize}, search=${search}, status=${status})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    class="page-item"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/members(page=${i}, size=${pageSize}, search=${search}, status=${status})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/members(page=${currentPage + 1}, size=${pageSize}, search=${search}, status=${status})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- DELETE CONFIRMATION MODAL -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="deleteConfirmModalLabel">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            Delete Member?
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    Are you sure you want to delete
                    <strong id="memberNamePlaceholder" class="text-danger"></strong>?
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <form id="deleteForm" method="post">

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <button type="submit" class="btn btn-danger" id="confirmDeleteBtn">
                            <span id="deleteBtnText">
                                <i class="bi bi-trash me-1"></i> Delete
                            </span>

                            <span id="deleteSpinner" class="spinner-border spinner-border-sm ms-2 text-light d-none"></span>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
    <!-- END DELETE CONFIRMATION -->

    <!-- JAVASCRIPT DELETE -->
    <script th:inline="javascript">
        function confirmDelete(button) {
            let url = button.getAttribute("data-url");
            let name = button.getAttribute("data-name");

            document.getElementById("deleteForm").action = url;
            document.getElementById("memberNamePlaceholder").textContent = name;

            let modal = new bootstrap.Modal(document.getElementById('deleteConfirmModal'));
            modal.show();
        }

        let deleteForm = document.getElementById("deleteForm");
        if (deleteForm) {
            deleteForm.addEventListener("submit", function() {
                let btn = document.getElementById("confirmDeleteBtn");
                let spinner = document.getElementById("deleteSpinner");

                btn.disabled = true;
                spinner.classList.remove("d-none");
                document.getElementById("deleteBtnText").style.opacity = "0.7";

                let modalEl = document.getElementById('deleteConfirmModal');
                let modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();
            });
        }
    </script>
    <!-- END JS DELETE -->

</div>

</html>
