<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Togetherness Women's Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
</head>
<body class="bg-dark d-flex align-items-center" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <!-- LOGO -->
            <div class="text-center mb-4">
                <img th:src="@{/images/logo-square.png}" alt="Togetherness Women's Club" height="120" class="mb-3 rounded-circle" />
                <h4 class="text-white fw-bold">Togetherness <span class="text-success">Women's Club</span></h4>
            </div>

            <!-- FORGOT PASSWORD CARD -->
            <div class="card shadow">
                <div class="card-body p-4">

                    <h5 class="card-title text-center mb-3">Forgot Password</h5>
                    <p class="text-muted text-center small">Enter your email address and we'll send you a link to reset your password.</p>

                    <form th:action="@{/forgot-password}" method="post">

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email"
                                       placeholder="Enter your email address" required />
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="bi bi-send me-1"></i>Send Reset Link
                            </button>
                        </div>

                    </form>

                    <div class="text-center mt-3">
                        <small><a th:href="@{/login}" class="text-success">Back to Login</a></small>
                    </div>
                </div>
            </div>

            <!-- FOOTER -->
            <p class="text-center text-secondary mt-4">
                <small>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> Togetherness Women's Club</small>
            </p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
