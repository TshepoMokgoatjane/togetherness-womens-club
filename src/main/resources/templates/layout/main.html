<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle} != null ? ${pageTitle} : 'Togetherness Womens Club'">Togetherness Women's Club</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

<!-- HEADER -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/members}">
            <i class="bi bi-people-fill me-2"></i>Togetherness Women's Club
        </a>
    </div>
</nav>

<!-- PAGE CONTENT -->
<main class="container my-4">

    <!-- ALERT SUCCESS -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- ALERT ERROR -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:replace="${content}">
        <!-- Page content will be inserted here -->
    </div>
</main>

<!-- FOOTER -->
<footer class="bg-dark text-light text-center py-3 mt-auto">
    <small>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> Togetherness Women's Club</small>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Auto-close alerts after 5 seconds -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll('.alert-dismissible').forEach(function(alert) {
            setTimeout(function () {
                alert.classList.remove("show");
                setTimeout(function() { alert.remove(); }, 500);
            }, 5000);
        });
    });
</script>
</body>
</html>
