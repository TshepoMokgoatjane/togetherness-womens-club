<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members List</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Members</h2>
        <a th:href="@{/members/new}" class="btn btn-primary" role="button">
            + Add Member
        </a>
    </div>

    <table class="table table-striped table-hover table-bordered">
        <thead class="table-light">
            <tr>
                <th>Member No#</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Phone</th>
                <th>Alternative</th>
                <th>Email</th>
                <th>Status</th>
                <th style="width: 220px">Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="member : ${members}">
                <td th:text="${member.memberNumber}"></td>
                <td th:text="${member.firstName}"></td>
                <td th:text="${member.lastName}"></td>
                <td th:text="${member.phoneNumber}"></td>
                <td th:text="${member.alternativePhoneNumber}"></td>
                <td th:text="${member.email}"></td>
                <td th:text="${member.status}"></td>

                <td>
                    <a th:href="@{/members/{id}/edit(id=${member.id})}"
                       class="btn btn-sm btn-primary">Edit</a>

                    <form th:action="@{/members/{id}/delete(id=${member.id})}"
                          method="post"
                          style="display:inline;"
                          onsubmit="return confirm('Are you sure you want to remove this member?');">

                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(members)}">
                <td colspan="8" class="text-center text-muted">
                    No members found
                </td>
            </tr>

        </tbody>

    </table>
</div>

</body>
</html>
