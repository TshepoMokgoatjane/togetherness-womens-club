<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">

    <h2><i class="bi bi-file-earmark-medical me-2"></i>All Burial Claims</h2>

    <div class="table-responsive mt-3">

        <div class="mb-3">
            <label for="claimDate" class="form-label">Sort By:</label>

            <label>
                <select class="form-select w-auto d-inline" onchange="location = this.value;">

                    <option th:value="@{/claims(sortBy='claimDate')}" id="claimDate"
                            th:selected="${sortBy == 'claimDate'}">
                    Claim Date
                    </option>

                    <option th:value="@{/claims(sortBy='claimAmount')}" id="amount"
                            th:selected="${sortBy == 'claimAmount'}">
                    Amount
                    </option>
                </select>
            </label>
        </div>


        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Member</th>
                    <th>Member No</th>
                    <th>Deceased Name</th>
                    <th>Claim Amount</th>
                    <th>Claim Date</th>
                    <th>Status</th>
                    <th style="width: 180px">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="claim, iter : ${claims}">
                    <td th:text="${currentPage * pageSize + iter.count}"></td>
                    <td th:text="${claim.member.firstName + ' ' + claim.member.lastName}"></td>
                    <td th:text="${claim.member.memberNumber}"></td>
                    <td th:text="${claim.deceasedName}"></td>
                    <td th:text="'R ' + ${#numbers.formatDecimal(claim.claimAmount, 1, 2)}"></td>
                    <td th:text="${claim.claimDate}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${claim.status.name() == 'APPROVED'} ? 'bg-success' :
                                              (${claim.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-danger')"
                              th:text="${claim.status}"></span>
                    </td>
                    <td>
                        <!-- Only show actions for PENDING claims -->
                        <div th:if="${claim.status.name() == 'PENDING'}" class="d-flex gap-1">
                            <button type="button" class="btn btn-sm btn-success" title="Approve"
                                    onclick="showClaimModal(this, 'approve')"
                                    th:data-url="@{/claims/{id}/approve(id=${claim.id})}"
                                    th:data-name="${claim.member.firstName + ' ' + claim.member.lastName}">
                                <i class="bi bi-check-lg me-1"></i>Approve
                            </button>
                            <button type="button" class="btn btn-sm btn-danger" title="Decline"
                                    onclick="showClaimModal(this, 'decline')"
                                    th:data-url="@{/claims/{id}/decline(id=${claim.id})}"
                                    th:data-name="${claim.member.firstName + ' ' + claim.member.lastName}">
                                <i class="bi bi-x-lg me-1"></i>Decline
                            </button>
                        </div>
                        <span th:if="${claim.status.name() != 'PENDING'}" class="text-muted">
                            <small>No actions</small>
                        </span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(claims)}">
                    <td colspan="8" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        No burial claims submitted yet
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- PAGINATION -->
        <div th:replace="~{fragments/pagination :: pager('/claims', ${currentPage}, ${totalPages}, ${pageSize})}"></div>
    </div>

    <!-- CLAIM ACTION CONFIRMATION MODAL -->
    <div class="modal fade" id="claimActionModal" tabindex="-1" aria-labelledby="claimActionModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header" id="claimModalHeader">
                    <h5 class="modal-title" id="claimActionModalLabel">
                        <i class="bi bi-question-circle-fill me-2"></i>
                        <span id="claimModalTitle"></span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <span id="claimModalMessage"></span>
                    <strong id="claimMemberName" class="text-dark"></strong>?
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>

                    <form id="claimActionForm" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn" id="claimActionBtn">
                            <span id="claimActionBtnText"></span>
                            <span id="claimActionSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
    <!-- END MODAL -->

    <!-- JAVASCRIPT -->
    <script th:inline="javascript">
        function showClaimModal(button, action) {
            let url = button.getAttribute("data-url");
            let name = button.getAttribute("data-name");

            let modalHeader = document.getElementById("claimModalHeader");
            let modalTitle = document.getElementById("claimModalTitle");
            let modalMessage = document.getElementById("claimModalMessage");
            let memberName = document.getElementById("claimMemberName");
            let actionBtn = document.getElementById("claimActionBtn");
            let actionBtnText = document.getElementById("claimActionBtnText");

            document.getElementById("claimActionForm").action = url;
            memberName.textContent = name;

            if (action === 'approve') {
                modalHeader.className = "modal-header bg-success text-white";
                modalTitle.textContent = "Approve Claim";
                modalMessage.textContent = "Are you sure you want to approve the claim for ";
                actionBtn.className = "btn btn-success";
                actionBtnText.innerHTML = '<i class="bi bi-check-lg me-1"></i>Approve';
            } else {
                modalHeader.className = "modal-header bg-danger text-white";
                modalTitle.textContent = "Decline Claim";
                modalMessage.textContent = "Are you sure you want to decline the claim for ";
                actionBtn.className = "btn btn-danger";
                actionBtnText.innerHTML = '<i class="bi bi-x-lg me-1"></i>Decline';
            }

            let modal = new bootstrap.Modal(document.getElementById('claimActionModal'));
            modal.show();
        }

        let claimForm = document.getElementById("claimActionForm");
        if (claimForm) {
            claimForm.addEventListener("submit", function() {
                let btn = document.getElementById("claimActionBtn");
                let spinner = document.getElementById("claimActionSpinner");
                btn.disabled = true;
                spinner.classList.remove("d-none");

                let modalEl = document.getElementById('claimActionModal');
                let modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();
            });
        }
    </script>

</div>

</html>
