# App
app.base-url=http://localhost:8080

# Resend (not used locally, but needed to avoid missing property errors)
resend.api-key=${RESEND_API_KEY:not-configured}
resend.from-email=${RESEND_FROM_EMAIL:Togetherness Womens Club <noreply@togethernesswomensclub.co.za>}

# Session timeout (30 minutes)
server.servlet.session.timeout=30m

# Static resource caching (7 days) - prevents re-fetching logos/images on every page
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# Gzip compression - reduces response size for text-based content
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB
