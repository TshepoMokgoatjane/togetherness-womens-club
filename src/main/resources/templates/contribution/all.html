<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">

    <h2><i class="bi bi-cash-coin me-2"></i>All Contributions</h2>

    <div class="table-responsive mt-3">

        <div class="mb-3">
            <label for="sortSelect" class="form-label">Sort By:</label>
            <select class="form-select w-auto d-inline" id="sortSelect" onchange="location = this.value;">
                <option th:value="@{/contributions(sortBy='paymentDate')}"
                        th:selected="${sortBy == 'paymentDate'}">
                    Payment Date
                </option>
                <option th:value="@{/contributions(sortBy='amount')}"
                        th:selected="${sortBy == 'amount'}">
                    Amount
                </option>
            </select>
        </div>

        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Member No#</th>
                    <th>Member</th>
                    <th>Amount</th>
                    <th>Reference</th>
                    <th>Payment Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="contribution, iter : ${contributions}">
                    <td th:text="${contribution.member.memberNumber}"></td>
                    <td th:text="${contribution.member.firstName + ' ' + contribution.member.lastName}"></td>
                    <td th:text="${contribution.amount != null} ? 'R ' + ${#numbers.formatDecimal(contribution.amount, 1, 2)} : '-'"></td>
                    <td th:text="${contribution.reference != null ? contribution.reference : '-'}"></td>
                    <td th:text="${contribution.paymentDate != null ? contribution.paymentDate : '-'}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${contribution.status.name() == 'PAID'} ? 'bg-success' :
                                              (${contribution.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-danger')"
                              th:text="${contribution.status}"
                              th:attr="title=${contribution.status.name() == 'PENDING'} ? 'Awaiting Payment' :
                                        (${contribution.status.name() == 'PAID'} ? 'Payment Completed' : 'Payment Missed')"
                              data-bs-toggle="tooltip" data-bs-placement="right"></span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(contributions)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        No contributions recorded yet
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- PAGINATION -->
        <div th:replace="~{fragments/pagination :: pager('/contributions', ${currentPage}, ${totalPages}, ${pageSize})}"></div>
    </div>

</div>

</html>
