<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Members List')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center page-header">
        <h2><i class="bi bi-people me-2"></i>Members</h2>
        <a th:href="@{/members/new}" class="btn btn-primary" role="button">
            <i class="bi bi-person-plus me-1"></i>Add Member
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Member No#</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Phone</th>
                        <th>Alternative</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th style="width: 180px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="member : ${members}">
                        <td th:text="${member.memberNumber}"></td>
                        <td th:text="${member.firstName}"></td>
                        <td th:text="${member.lastName}"></td>
                        <td th:text="${member.phoneNumber}"></td>
                        <td th:text="${member.alternativePhoneNumber}"></td>
                        <td th:text="${member.email}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${member.status.name() == 'ACTIVE'} ? 'badge-active' :
                                                  (${member.status.name() == 'INACTIVE'} ? 'badge-inactive' :
                                                  (${member.status.name() == 'SUSPENDED'} ? 'badge-suspended' : 'badge-deceased'))"
                                  th:text="${member.status}"></span>
                        </td>
                        <td>
                            <a th:href="@{/members/{id}(id=${member.id})}"
                               class="btn btn-sm btn-outline-primary me-1"
                               title="View">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/members/{id}/edit(id=${member.id})}"
                               class="btn btn-sm btn-primary me-1"
                               title="Edit">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/members/{id}/delete(id=${member.id})}"
                                  method="post"
                                  style="display:inline;"
                                  onsubmit="return confirm('Are you sure you want to remove this member?');">
                                <button type="submit" class="btn btn-sm btn-danger" title="Delete">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(members)}">
                        <td colspan="8" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            No members found
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
