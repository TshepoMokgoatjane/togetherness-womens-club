<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">

    <h2><i class="bi bi-file-earmark-medical me-2"></i>Submit Burial Claim</h2>

    <div class="card mt-3">
        <div class="card-body">
            <form th:action="@{/claims}" th:object="${claim}" method="post">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="memberId" class="form-label">Member</label>
                        <select class="form-select" id="memberId" name="memberId" required
                                th:classappend="${memberError} ? 'is-invalid'">
                            <option value="">-- Select Member --</option>
                            <option th:each="member : ${members}"
                                    th:value="${member.id}"
                                    th:selected="${member.id == selectedMemberId}"
                                    th:text="${member.memberNumber + ' - ' + member.firstName + ' ' + member.lastName}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${memberError}" th:text="${memberError}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="deceasedName" class="form-label">Deceased Name</label>
                        <input type="text" class="form-control" id="deceasedName"
                               th:field="*{deceasedName}"
                               th:classappend="${#fields.hasErrors('deceasedName')} ? 'is-invalid'"
                               placeholder="Full name of the deceased" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('deceasedName')}"
                             th:errors="*{deceasedName}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="claimAmount" class="form-label">Claim Amount (R)</label>
                        <input type="number" step="0.01" class="form-control" id="claimAmount"
                               th:field="*{claimAmount}"
                               th:classappend="${#fields.hasErrors('claimAmount')} ? 'is-invalid'"
                               placeholder="Enter claim amount" />
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('claimAmount')}"
                             th:errors="*{claimAmount}"></div>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-lg me-1"></i>Submit Claim
                    </button>
                    <a th:href="@{/claims}" class="btn btn-secondary ms-2">
                        <i class="bi bi-x-lg me-1"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

</div>

</html>
