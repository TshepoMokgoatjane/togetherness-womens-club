<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout(~{::content})}">

<div th:fragment="content">

    <div class="text-center py-5">
        <i class="bi bi-shield-lock-fill text-warning display-1"></i>
        <h1 class="display-5 mt-3">403 — Access Denied</h1>
        <p class="lead mt-2">You do not have permission to access this page.</p>
        <p class="text-muted">Please contact an administrator if you believe this is an error.</p>

        <a th:href="@{/members}" class="btn btn-success mt-3" sec:authorize="hasAnyRole('ADMIN', 'TREASURER')">
            <i class="bi bi-arrow-left me-1"></i>Back to Members
        </a>
        <a th:href="@{/login}" class="btn btn-success mt-3" sec:authorize="!hasAnyRole('ADMIN', 'TREASURER')">
            <i class="bi bi-box-arrow-in-right me-1"></i>Login with a different account
        </a>
    </div>

</div>

</html>
